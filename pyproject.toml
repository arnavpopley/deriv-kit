[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derivkit"
version = "2.0.0"
description = "Python derivatives pricing toolkit with analytic, tree, and Monte Carlo engines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Arnav Popley", email = "arnavpopley@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
numpy = ["numpy>=1.26"]
cpp = ["pybind11>=2.12"]
bench = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
derivkit = "derivkit.__main__:main"
groww-chain = "derivkit.cli.groww_chain:main"
vanilla-comparison = "derivkit.cli.vanilla_comparison:main"
american-put = "derivkit.cli.american_put:main"
variance-reduction = "derivkit.cli.variance_reduction:main"
convergence = "derivkit.cli.convergence:main"
implied-vol = "derivkit.cli.implied_vol:main"

[project.urls]
Homepage = "https://github.com/arnavpopley/deriv-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/derivkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# A back end that is present but broken warns; in the test suite that is a failure, so a
# build that merely looks "not installed" cannot hide behind skipped tests.
filterwarnings = ["error:backend:RuntimeWarning"]

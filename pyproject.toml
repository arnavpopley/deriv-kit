[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derivkit"
version = "2.0.0"
description = "Python derivatives pricing toolkit with analytic, tree, and Monte Carlo engines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Arnav Popley", email = "arnavpopley@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
groww-chain = "derivkit.cli.groww_chain:main"
vanilla-comparison = "derivkit.cli.vanilla_comparison:main"
american-put = "derivkit.cli.american_put:main"
variance-reduction = "derivkit.cli.variance_reduction:main"
convergence = "derivkit.cli.convergence:main"
implied-vol = "derivkit.cli.implied_vol:main"

[project.urls]
Homepage = "https://github.com/arnavpopley/deriv-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/derivkit"]

[tool.hatch.build.targets.wheel.force-include]
"examples/data/nifty_chain.json" = "derivkit/data/nifty_chain.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDERIVKIT_WERROR=ON \
            -DDERIVKIT_BUILD_TESTS=ON \
            -DDERIVKIT_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sanitizers
        if: matrix.compiler == 'g++'
        env:
          CXX: g++
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDERIVKIT_WERROR=ON \
            -DDERIVKIT_SANITIZE=ON
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure
